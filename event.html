<!doctype html><html lang="ja" style="background:#fdf6e0;color-scheme:light only"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>出店の準備｜どんぐりの夢</title><link rel="stylesheet" href="private.css"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="event.css"><script src="ime.js?v=20261117-ime2"></script>
<script src="comments-config.js?v=20261117-ime2"></script><script defer src="ui-icons.js"></script><script defer src="context-comments.js?v=20261117-ime2"></script><script defer src="event.js"></script><script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script defer src="comments-api.js?v=20261117-ime2"></script></head>
<body class="journal-page event-plan-page"><header class="site-head"><a class="brand" href="index.html#events">どんぐりの夢</a><a href="index.html#events">出店一覧</a></header><nav class="primary-nav private-primary" aria-label="主な機能"><a data-icon="events" aria-current="page" href="index.html#events">出店</a><a data-icon="works" href="index.html#works">作品・在庫</a><a data-icon="booth" href="index.html#market">売り場</a><a data-icon="task" href="private.html#kind=task">やること</a></nav><main>
<section class="connection"><p id="comments-status" role="status">LINE認証を確認中</p><button id="comments-login">再読込</button></section><h1 id="event-title">出店の準備</h1><p id="event-message" role="status"></p><section id="event-detail" hidden><div class="event-phases" role="group" aria-label="出店で行うこと"><button data-plan-phase="prepare" aria-pressed="true" data-icon="task">準備</button><button data-plan-phase="day" aria-pressed="false" data-icon="events">当日</button><button data-plan-phase="review" aria-pressed="false" data-icon="review">振り返り</button></div><div id="event-context"></div><div id="event-actions" class="workflow-actions"></div><div id="event-selections"></div><div id="event-comment-entry"></div></section>
<section id="context-comments" hidden aria-label="対象へのコメント"></section><form novalidate id="event-form" hidden autocomplete="off"><fieldset id="event-fields" disabled><div class="market-tabs" role="group" aria-label="編集する内容"><button type="button" data-plan-tab="basic" aria-pressed="true">基本情報</button><button type="button" data-plan-tab="products" aria-pressed="false">持参作品 <span id="products-count">0</span></button><button type="button" data-plan-tab="pops" aria-pressed="false">使用ポップ <span id="pops-count">0</span></button></div>
<section data-plan-panel="basic"><label>出店名<input name="title" required maxlength="160"></label><div id="event-private-metadata"><label>日付<input name="date" type="date"></label><div class="field-pair"><label>開始<input name="start" type="time"></label><label>終了<input name="end" type="time"></label></div><label>会場<input name="venue" maxlength="300"></label></div><p id="event-public-source" hidden>既存出店の日時・会場は公開資料を参照。ここでは持参品・ポップ・私的メモだけを保存。</p><label>準備メモ<textarea name="notes" maxlength="4000" rows="3"></textarea></label><p class="hint">新しい出店・選択内容・メモは二人用に保存。公開ページや更新シートへは自動掲載しない。</p></section>
<section data-plan-panel="products" hidden><label>作品を探す<input type="search" id="product-search" autocomplete="off"></label><p class="hint">持参する種類を選択。数量・在庫数とは別。</p><div id="product-options" class="selection-grid"></div></section>
<section data-plan-panel="pops" hidden><label>ポップを探す<input type="search" id="pop-search" autocomplete="off"></label><div id="pop-options" class="selection-grid"></div></section>
<div class="event-save-actions"><button class="primary" type="submit" id="event-save" data-icon="save">保存</button><button type="button" id="event-cancel">編集を閉じる</button></div></fieldset></form><p class="hint">未保存入力は同じLINEアカウントの再確認後に復元。再読込・タブ終了・OSによるページ破棄の前に保存。</p></main></body></html>
